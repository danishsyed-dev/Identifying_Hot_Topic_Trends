{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Provider Login - Identifying Hot Topic Trends</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <img src="{% static 'login.jpg' %}" alt="Service Provider Login" class="auth-banner">
      <div class="card-body">
        <h2 class="auth-title">Service Provider Login</h2>
        <p class="subtitle text-center">Identifying Hot Topic Trends</p>

        <form method="POST" role="form">
          {% csrf_token %}
          <div class="form-group">
            <label class="form-label" for="username">User Name</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Enter User Name" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter Password" required>
          </div>
          <div class="form-group">
            <input type="submit" name="submit1" value="Login" class="btn btn-primary btn-full">
          </div>
          <div class="auth-actions">
            <a href="{% url 'login' %}" class="btn btn-secondary btn-full">User Login</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
