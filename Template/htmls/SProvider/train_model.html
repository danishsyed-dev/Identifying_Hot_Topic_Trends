{% extends 'SProvider/design1.html' %}
{% block researchblock %}

<div class="page-header text-center">
  <h2>View Datasets Trained and Tested Results</h2>
  <p class="subtitle">Machine Learning Model Accuracies</p>
</div>

<div class="card">
  <div class="card-body">
    <form role="form" method="POST">
      {% csrf_token %}
      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>Model Type</th>
              <th>Accuracy</th>
            </tr>
          </thead>
          <tbody>
            {% for object in objs %}
            <tr>
              <td>{{ object.names }}</td>
              <td>{{ object.ratio }}</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </form>
  </div>
</div>

{% endblock %}
