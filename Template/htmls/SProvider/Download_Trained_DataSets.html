{% extends 'SProvider/design1.html' %}
{% block researchblock %}

<div class="page-header text-center">
  <h2>Download Trained Data Sets</h2>
  <p class="subtitle">Export Predicted Trends & Model Data</p>
</div>

<div class="card profile-card text-center">
  <div class="card-body">
    <h3>Export Data to Excel</h3>
    <p>Download the complete trained dataset predictions in Excel (.xls) format.</p>
    <form method="POST">
      {% csrf_token %}
      <a href="{% url 'Download_Trained_DataSets' %}" class="btn btn-accent">Download Trained Data Sets</a>
    </form>
  </div>
</div>

{% endblock %}
