<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login - Identifying Hot Topic Trends</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>

  <div class="auth-container">
      <div class="auth-header">
        <div class="auth-icon-badge">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
      </div>
      <div class="card-body">
        <h2 class="auth-title">User Login</h2>
        <p class="subtitle text-center">Identifying Hot Topic Trends in Streaming Text Data</p>

        <form method="POST">
          {% csrf_token %}
          <div class="form-group">
            <label class="form-label" for="username">User Name</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="User Name" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
          </div>

          <div class="form-group">
            <input type="submit" name="submit1" class="btn btn-primary btn-full" value="Login">
          </div>
        </form>

        <div class="auth-actions">
          <a href="{% url 'serviceproviderlogin' %}" class="btn btn-secondary">Service Provider</a>
          <a href="{% url 'Register1' %}" class="btn btn-accent">Register</a>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
