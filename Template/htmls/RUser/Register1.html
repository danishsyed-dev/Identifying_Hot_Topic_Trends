<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Identifying Hot Topic Trends</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>

  <div class="auth-container">
    <div class="auth-card">
      <img src="{% static 'Register.jpg' %}" alt="Register" class="auth-banner">
      <div class="card-body">
        <h2 class="auth-title">Register Your Details</h2>
        <p class="subtitle text-center">Identifying Hot Topic Trends in Streaming Text Data</p>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="alert alert-success">{{ success }}</div>
        {% endif %}

        <form method="POST">
          {% csrf_token %}
          <div class="form-group">
            <label class="form-label" for="username">User Name</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="User Name" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="Email Address" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="phoneno">Mobile Number</label>
            <input type="number" id="phoneno" name="phoneno" class="form-control" placeholder="Mobile Number" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="country">Country</label>
            <input type="text" id="country" name="country" class="form-control" placeholder="Country" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="state">State</label>
            <input type="text" id="state" name="state" class="form-control" placeholder="State" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="city">City</label>
            <input type="text" id="city" name="city" class="form-control" placeholder="City" required>
          </div>

          <div class="form-group">
            <input type="submit" name="submit" class="btn btn-primary btn-full" value="Register">
          </div>
        </form>

        <div class="auth-actions">
          <a href="{% url 'login' %}" class="btn btn-secondary btn-full">User Login</a>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
